name: Showcase
options:
  bundleIdPrefix: com.example
  deploymentTarget: { iOS: "16.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    MARKETING_VERSION: "1.0.0"
targets:
  Showcase:
    type: application
    platform: iOS
    sources:
      - path: Showcase
        excludes: ["*.entitlements"]
    settings:
      base:
        INFOPLIST_FILE: Showcase/Info.plist
        CODE_SIGN_ENTITLEMENTS: Showcase/Showcase.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.example.showcase
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Showcase:
    build:
      targets: { Showcase: all }
