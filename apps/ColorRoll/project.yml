name: ColorRoll
options:
  bundleIdPrefix: com.example
  deploymentTarget: { iOS: "16.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    MARKETING_VERSION: "1.0.0"           # human version; bump per release
targets:
  ColorRoll:
    type: application
    platform: iOS
    sources:
      - path: ColorRoll
        excludes: ["*.entitlements"]
    settings:
      base:
        INFOPLIST_FILE: ColorRoll/Info.plist
        CODE_SIGN_ENTITLEMENTS: ColorRoll/ColorRoll.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.example.colorroll
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ColorRoll:
    build:
      targets: { ColorRoll: all }
